<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title card</title>
  </head>
  <body>
    <template>
      <div
        id="title"
        data-composition-id="title"
        data-width="1920"
        data-height="1080"
        data-duration="4.2"
      >
        <style>
          #title {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          #title-stack {
            display: block;
            width: 1500px;
            text-align: center;
          }

          #title-headline {
            display: block;
            margin: 0;
            font-size: 104px;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #141413;
            opacity: 0;
          }

          #title-rule {
            display: block;
            width: 220px;
            height: 8px;
            margin: 40px auto 0;
            border-radius: 4px;
            background: #d97757;
            transform-origin: center;
          }

          #title-subhead {
            display: block;
            margin: 36px 0 0;
            font-size: 40px;
            font-weight: 400;
            color: #5c5b57;
            opacity: 0;
          }
        </style>

        <div id="title-stack">
          <h1 id="title-headline">Motion, written in code</h1>
          <span id="title-rule"></span>
          <p id="title-subhead">HTML and GSAP, rendered to MP4</p>
        </div>

        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
              "#title-headline",
              { opacity: 0, y: 40 },
              { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
              0.3,
            );
            tl.fromTo(
              "#title-rule",
              { scaleX: 0 },
              { scaleX: 1, duration: 0.6, ease: "power3.out" },
              0.7,
            );
            tl.fromTo(
              "#title-subhead",
              { opacity: 0, y: 20 },
              { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
              1.0,
            );

            // Gentle settle so the final second is not a frozen frame.
            tl.to("#title-stack", { y: -16, duration: 1.6, ease: "sine.inOut" }, 2.2);

            window.__timelines["title"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
