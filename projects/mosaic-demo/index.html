<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mosaic Demo - HyperFrames</title>
    <!-- Vendored locally on purpose: renders stay deterministic and work offline. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #f0eee6;
        font-family: system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f0eee6;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      #mosaic-layer {
        z-index: 1;
      }

      #title-layer {
        z-index: 2;
      }

      #vignette {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(20, 20, 19, 0.28) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div
        id="mosaic-layer"
        class="clip"
        data-composition-id="mosaic"
        data-composition-src="compositions/mosaic.html"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="title-layer"
        class="clip"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="1.8"
        data-duration="4.2"
        data-track-index="1"
      ></div>

      <div id="vignette"></div>
    </div>

    <script>
      // The master timeline. Child composition timelines are auto-nested by the
      // runtime, so this one only owns master-level treatment.
      const tl = gsap.timeline({ paused: true });
      tl.to("#vignette", { opacity: 1, duration: 1.2, ease: "power2.out" }, 1.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
